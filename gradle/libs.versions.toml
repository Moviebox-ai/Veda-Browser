[versions]
agp = "9.1.1"
kotlin = "2.2.10"
compose-bom = "2024.09.00"
activity-compose = "1.10.1"
core-ktx = "1.15.0"
lifecycle = "2.8.7"
material-icons = "1.7.0"
gson = "2.11.0"
coroutines = "1.10.2"
webkit = "1.12.1"
