name: Android CI

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew || true

    - name: Setup debug keystore
      run: |
        if [ -f debug.keystore.base64 ] && [ ! -f debug.keystore ]; then
          base64 -d debug.keystore.base64 > debug.keystore || true
        fi
        if [ ! -f debug.keystore ]; then
          keytool -genkeypair -alias androiddebugkey -keypass android -keystore debug.keystore -storepass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000 || true
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace

    - name: Upload Debug APK (Artifacts)
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: velocity-browser-debug
        path: app/build/outputs/apk/debug/*.apk
        if-no-files-found: warn
        retention-days: 1

    - name: Release APK (Bypasses Artifact Quota)
      if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name != 'pull_request'
      uses: softprops/action-gh-release@v2
      continue-on-error: true
      with:
        tag_name: "v1.0.${{ github.run_number }}"
        name: "Velocity Browser Debug APK (Build #${{ github.run_number }})"
        body: |
          Automated debug build generated by GitHub Actions.
          Direct download link for APK is available in the Assets section below.
        draft: false
        prerelease: false
        files: app/build/outputs/apk/debug/*.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}


