name: Android CI & Build

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (debug or release)'
        required: true
        default: 'debug'
        type: choice
        options:
          - debug
          - release
      upload_artifacts:
        description: 'Upload build artifacts (disable if GitHub storage quota is reached)'
        required: false
        default: true
        type: boolean

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android App
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Accept Android SDK Licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      - name: Prepare Environment & Secrets
        run: |
          # Ensure .env file exists for Secrets Gradle Plugin
          if [ ! -f ".env" ] && [ -f ".env.example" ]; then
            cp .env.example .env
            echo ".env created from .env.example"
          fi

          # Restore or generate debug.keystore for reliable APK signing
          if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
            base64 -d debug.keystore.base64 > debug.keystore || true
            echo "debug.keystore restored from base64"
          fi
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US" || true
            echo "Fresh debug.keystore generated"
          fi

      - name: Run Unit Tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Build Debug APK
        if: github.event.inputs.build_type != 'release'
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release'
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace || ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success() && (github.event.inputs.upload_artifacts != false)
        continue-on-error: true
        with:
          name: velocity-browser-apk
          path: app/build/outputs/apk/*/*.apk
          retention-days: 1
          if-no-files-found: ignore

      - name: Upload Unit Test Results (On Failure Only)
        uses: actions/upload-artifact@v4
        if: failure() && (github.event.inputs.upload_artifacts != false)
        continue-on-error: true
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          retention-days: 1
          if-no-files-found: ignore
